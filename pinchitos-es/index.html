<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <!-- ============================================================ -->
  <!-- ⚠️  DESTINATION DU QR — PINCHITOS ES — SEULE LIGNE À MODIFIER  -->
  <!-- Remplacez l'adresse ci-dessous (url=...) par la nouvelle     -->
  <!-- destination. Ne touchez à rien d'autre dans ce fichier.      -->
  <!-- ============================================================ -->
  <meta http-equiv="refresh" content="0; url=https://search.google.com/local/writereview?placeid=ChIJ_YenEzjKQQwR8bFh32-FuRY">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirection en cours...</title>

  <script>
    // Redirection JavaScript instantanée (backup de la balise meta ci-dessus).
    // La destination est lue automatiquement depuis la balise meta refresh :
    // il n'y a donc RIEN à modifier ici.
    (function () {
      var meta = document.querySelector('meta[http-equiv="refresh"]');
      if (meta) {
        var match = meta.content.match(/url=(.+)/i);
        if (match) {
          window.location.replace(match[1].trim());
        }
      }
    })();
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    .message {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 1rem;
      border: 4px solid #ddd;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="message">
    <div class="spinner"></div>
    <p>Redirection en cours...</p>
  </div>
</body>
</html>
